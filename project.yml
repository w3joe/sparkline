name: GB10PowerMonitor
options:
  bundleIdPrefix: com.w3joe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: FZ26Z8W5FZ
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP_ID: FZ26Z8W5FZ.com.w3joe.gb10power
    DEAD_CODE_STRIPPING: YES

packages:
  PowerCore:
    path: Packages/PowerCore

targets:
  GB10PowerMonitor:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: PowerCore
        product: PowerCore
      - package: PowerCore
        product: PowerShared
      - target: GB10Widgets
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GB10 Power Monitor
        CFBundleName: GB10 Power Monitor
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: GB10 Power Monitor reads and switches your Tapo P110 plugs and connects to your DGX Sparks over SSH on your local network.
        AppGroupIdentifier: $(APP_GROUP_ID)
    entitlements:
      path: App/GB10PowerMonitor.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w3joe.GB10PowerMonitor
        PRODUCT_NAME: GB10PowerMonitor
        COMBINE_HIDPI_IMAGES: YES
    preBuildScripts:
      - name: Build tapo-helper
        script: |
          "${SRCROOT}/scripts/build-helper.sh"
        basedOnDependencyAnalysis: false
        showEnvVars: false

  GB10Widgets:
    type: app-extension
    platform: macOS
    sources:
      - Widgets
    dependencies:
      - package: PowerCore
        product: PowerShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: GB10 Power
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupIdentifier: $(APP_GROUP_ID)
    entitlements:
      path: Widgets/GB10Widgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w3joe.GB10PowerMonitor.Widgets
        PRODUCT_NAME: GB10Widgets
        SKIP_INSTALL: YES

  gb10ctl:
    type: tool
    platform: macOS
    sources:
      - Tools/gb10ctl
    dependencies:
      - package: PowerCore
        product: PowerShared
    entitlements:
      path: Tools/gb10ctl/gb10ctl.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.w3joe.GB10PowerMonitor.ctl
        PRODUCT_NAME: gb10ctl

schemes:
  GB10PowerMonitor:
    build:
      targets:
        GB10PowerMonitor: all
        GB10Widgets: all
        gb10ctl: all
    run:
      config: Debug
      commandLineArguments:
        "--simulate": false
    test:
      config: Debug
      targets:
        - package: PowerCore/PowerCoreTests
    archive:
      config: Release
