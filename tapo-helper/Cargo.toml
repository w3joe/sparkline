[package]
name = "tapo-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
tapo = "=0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
